async function watch(id){const{data:e}=await sb.from('episodes').select('*').eq('id',id).single();if(!e)return app.innerHTML='<p class=w>Episode not found</p>';const a=A.find(x=>x.id==e.anime_id)||{};const{data:l}=await sb.from('episodes').select('id').eq('anime_id',e.anime_id).eq('available',true).order('season').order('number');const L=l||[],i=L.findIndex(x=>x.id==id),pv=L[i-1],nx=L[i+1];

app.innerHTML=`<section class=w><a class=mu href="#/a/${e.anime_id}">← ${esc(a.title||'Back')}</a><br><br><h2>EP ${e.number} · ${esc(e.title)}</h2><br><div class="pw gb">${e.video_url?`<video id=v controls playsinline preload=metadata poster="${esc(e.thumb||'')}">${e.subtitle_url?`<track kind=subtitles label=Subtitles srclang=en src="${esc(e.subtitle_url)}" default>`:''}</video>`:'<p class=er2>No video uploaded yet.</p>'}</div><div class=bs>${pv?`<a class="bt o" href="#/w/${pv.id}">‹ Previous</a>`:''}${nx?`<a class=bt href="#/w/${nx.id}">Next ›</a>`:''}<select id=sd><option value=1>1x<option value=.75>0.75x<option value=1.25>1.25x<option value=1.5>1.5x<option value=2>2x</select><label class=chip><input type=checkbox id=an ${localStorage.an=='0'?'':'checked'}> Auto next</label>${dl?`<a class="bt o" target=_blank rel=noopener href="${esc(dl)}" download>⬇ Download</a>`:''}</div><p class=sy>${esc(e.description)}</p><h3>Comments</h3><div id=cm></div></section>`;cmt(e.anime_id,id);
const v=$('#v');if(!v)return;const src=e.video_url,bad=()=>{$('.pw').innerHTML='<p class=er2>This video could not be loaded. The link may be broken, private or blocked from playing on other sites.</p>'};
v.src=src;
v.onerror=bad;$('#sd').onchange=x=>v.playbackRate=+x.target.value;$('#an').onchange=x=>localStorage.an=x.target.checked?1:0;let last=0;
if(me){const{data:pr}=await sb.from('progress').select('pos').match({user_id:me.id,episode_id:id}).maybeSingle();if(pr&&pr.pos>10)v.addEventListener('loadedmetadata',()=>{if(confirm('Resume from '+Math.floor(pr.pos/60)+':'+String(Math.floor(pr.pos%60)).padStart(2,'0')+'?'))v.currentTime=pr.pos},{once:true})}
v.ontimeupdate=()=>{if(me&&v.duration&&Date.now()-last>5000){last=Date.now();sb.from('progress').upsert({user_id:me.id,episode_id:id,anime_id:e.anime_id,pos:v.currentTime,dur:v.duration,updated_at:new Date().toISOString()})}};
v.onended=()=>{if(nx&&$('#an').checked)location.hash='#/w/'+nx.id}}
/* ---------- profile ---------- */
async function prof(){if(!me){app.innerHTML='<section class=w><button class=bt onclick=auth()>Log in</button></section>';return}const{data:h}=await sb.from('progress').select('anime_id').eq('user_id',me.id).order('updated_at',{ascending:false}).limit(20);const seen=[...new Set((h||[]).map(x=>x.anime_id))].map(i=>A.find(a=>a.id==i)).filter(Boolean);
app.innerHTML=`<section class="w prf"><div class=pc><label class=bigav><input type=file accept="image/*" hidden onchange=pa(this)>${av(P?.name||me.email,P?.avatar)}<em>Change photo</em></label><h2>${esc(P?.name||'')}</h2><p class=mu>${esc(me.email)}</p></div><div class="fm bx2"><label>Username<input id=pn value="${esc(P?.name)}"></label><button class=bt onclick=sp()>Save profile</button><label>New password<input id=np type=password placeholder="Min 6 characters"></label><button class="bt o" onclick=cp()>Change password</button><button class="bt o" onclick=lo()>Log out</button></div></section>`+row('Watch History','',seen)+row('Wishlist','',A.filter(a=>W.has(a.id)))}
async function pa(i){const f=i.files[0];if(!f)return;toast('Uploading photo…');try{const u=await up(f,400,me.id);const r=await sb.from('profiles').update({avatar:u}).eq('id',me.id);if(r.error)throw r.error;P.avatar=u;hdr();prof();toast('Photo updated')}catch(e){toast('Upload failed: '+e.message)}}
async function sp(){const n=$('#pn').value.trim();const r=await sb.from('profiles').update({name:n}).eq('id',me.id);if(r.error)return toast(r.error.message);P.name=n;hdr();prof();toast('Profile saved')}
async function cp(){const p=$('#np').value;if(p.length<6)return toast('Password must be at least 6 characters');const r=await sb.auth.updateUser({password:p});toast(r.error?r.error.message:'Password changed')}
/* ---------- admin studio ---------- */
const G=['Action','Adventure','Comedy','Drama','Fantasy','Horror','Mystery','Romance','Sci-Fi','Slice of Life','Sports','Supernatural','Mecha','Thriller','Isekai'];
const fld=(k,l,v={},t='text')=>`<label>${l}<input data-f=${k} type=${t} step=any value="${esc(v[k])}"></label>`;
const seg=(k,o,v)=>`<div class=seg>${o.map(x=>`<label><input type=radio name=${k} value="${x}" data-f=${k}${x==v?' checked':''}><span>${x}</span></label>`).join('')}</div>`;
const tgl=(k,l,v={})=>`<label class=tg><span>${l}</span><input type=checkbox data-f=${k}${v[k]?' checked':''}><i></i></label>`;
const pick=(k,l,v={},m=1000)=>`<div class=pk><small>${l}</small><label class="pkb ${k=='poster'?'tall':'wide'}"><input type=file accept="image/*" hidden onchange="pk(this,${m})"><input type=hidden data-f=${k} value="${esc(v[k])}">${v[k]?`<img src="${esc(v[k])}">`:''}<span>＋ Tap to upload photo</span></label></div>`;
const col=r=>{const o={};r.querySelectorAll('[data-f]').forEach(i=>{const k=i.dataset.f;if(i.type=='radio'){if(i.checked)o[k]=i.value;return}o[k]=i.type=='checkbox'?i.checked:i.type=='number'?(i.value===''?null:+i.value):i.value===''?null:i.value});return o};
async function pk(i,m){const f=i.files[0];if(!f)return;const l=i.parentNode;l.classList.add('busy');try{const u=await up(f,m,'art');l.querySelector('[data-f]').value=u;let g=l.querySelector('img');if(!g){g=document.createElement('img');l.prepend(g)}g.src=u;pvr()}catch(e){toast('Upload failed: '+e.message)}l.classList.remove('busy')}
function pvr(){const p=$('#pvc'),f=$('#af');if(!p||!f)return;const o=col(f);o.genres=(o.genres||'').split(',').filter(Boolean);o.id='';p.innerHTML=cd({...o,title:o.title||'Your title'})+`<div class=pvb>${o.background?`<img src="${esc(o.background)}">`:''}<b>${esc(o.title||'Your title')}</b></div>`}
const gs=()=>{$('#gv').value=[...document.querySelectorAll('#gc .on')].map(x=>x.textContent).join(',');pvr()};
function ae(id){const v=id?A.find(a=>a.id==id):{type:'Series',status:'Airing',published:true};eid=id||null;const gl=[...new Set([...G,...(v.genres||[])])];
$('#md').innerHTML=`<div class=mb><div class="bx sheet"><div class=shh><h3>${id?'Edit anime':'New anime'}</h3><button class=ib onclick="$('#md').innerHTML=''">✕</button></div><small>How it will look on the site</small><div id=pvc class=pvc></div>
<div class=fm id=af oninput=pvr()>${pick('poster','Poster (portrait photo)',v,900)}${pick('background','Banner (wide photo)',v,1600)}${fld('title','Title',v)}<label>Description<textarea data-f=synopsis rows=4>${esc(v.synopsis)}</textarea></label><div>${seg('type',['Series','Movie'],v.type)}</div><div>${seg('status',['Upcoming','Airing','Completed'],v.status)}</div>
<div><small>Genres</small><div class=chips id=gc>${gl.map(g=>`<span class="chip ch${(v.genres||[]).includes(g)?' on':''}" onclick="this.classList.toggle('on');gs()">${g}</span>`).join('')}</div><input type=hidden id=gv data-f=genres value="${esc((v.genres||[]).join(','))}"></div>
<div class=fm><small>Where should it appear?</small>${tgl('published','Published (visible to everyone)',v)}${tgl('featured','📍 Pin to hero banner',v)}${tgl('trending','Trending Now',v)}${tgl('new_release','New Releases',v)}${tgl('dub','Aniduvia Dub',v)}${tgl('coming_soon','Coming Soon',v)}</div>
<details><summary>More details (optional)</summary><div class=fm>${fld('alt_title','Alternative title',v)}${fld('year','Year',v,'number')}${fld('rating','Rating (0-10)',v,'number')}${fld('studio','Studio',v)}${fld('release_date','Release date',v,'date')}${fld('episode_count','Episode count',v,'number')}${fld('featured_order','Hero order (1 = first)',v,'number')}</div></details></div>
<div class=bs><button class="bt o" onclick="sa(false)">Save draft</button><button class=bt onclick="sa(true)">Publish</button></div></div></div>`;pvr()}
async function sa(pub){const o=col($('#af'));o.published=pub;o.genres=(o.genres||'').split(',').filter(Boolean);if(!o.title)return toast('Please add a title');const r=eid?await sb.from('anime').update(o).eq('id',eid):await sb.from('anime').insert(o);if(r.error)return toast(r.error.message);$('#md').innerHTML='';toast(pub?'Published!':'Saved as draft');await loadA();admin()}
async function da(id){const a=A.find(x=>x.id==id);if(confirm('Delete "'+a.title+'" and all its episodes? This cannot be undone.')){const r=await sb.from('anime').delete().eq('id',id);if(r.error)return toast(r.error.message);toast('Deleted');await loadA();admin()}}
async function admin(){if(!isA()){app.innerHTML='<section class=w><h2>Admins only</h2><p class=mu>Log in with the owner account.</p></section>';return}
const[{data:ep},{count:uc},{count:cc}]=await Promise.all([sb.from('episodes').select('id,anime_id,video_url,embed_url'),sb.from('profiles').select('*',{count:'exact',head:true}),sb.from('comments').select('*',{count:'exact',head:true})]);const E=ep||[],miss=E.filter(x=>!x.video_url&&!x.embed_url).length,st=(t,n)=>`<div class=stc><small>${t}</small><b>${n}</b></div>`;
app.innerHTML=`<section class=w><h2>Admin studio</h2><div class=stg>${st('Anime',A.length)}${st('Episodes',E.length)}${st('Users',uc)}${st('Comments',cc)}</div>${miss?`<p class=ee>⚠ ${miss} episode(s) have no video yet.</p><br>`:''}<div class=ag><div class=nw onclick=ae()><span>＋</span>New anime</div>${A.map((a,k)=>`<div class=ac style="--i:${k}">${im(a.poster)}<div class=ai><b>${esc(a.title)}</b><span class="st ${a.published?'ok':''}">${a.published?'Published':'Draft'}</span><small>${a.type} · ${E.filter(x=>x.anime_id==a.id).length} episodes</small><div class=acts><button class="bt sm o" onclick="ae('${a.id}')">Edit</button><button class="bt sm" onclick="ax('${a.id}')">Episodes</button><button class="bt sm dl" onclick="da('${a.id}')">🗑 Delete</button></div></div></div>`).join('')}</div></section>`}
/* episodes sheet */
async function ax(id){const a=A.find(x=>x.id==id);const{data}=await sb.from('episodes').select('*').eq('anime_id',id).order('season').order('number');XC={};(data||[]).forEach(x=>XC[x.id]=x);const n=(data||[]).length+1;
$('#md').innerHTML=`<div class=mb><div class="bx sheet"><div class=shh><h3>${esc(a.title)}</h3><button class=ib onclick="$('#md').innerHTML=''">✕</button></div><div>${(data||[]).map(x=>`<div class=ac><div class=ai><b>S${x.season} · EP ${x.number} · ${esc(x.title)}</b><small>${x.video_url?'🎬 Video uploaded':'⚠ No video yet'} · ${x.available?'Visible':'Hidden'}</small><div class=acts><button class="bt sm o" onclick="xe('${x.id}')">Edit</button><button class="bt sm dl" onclick="xd('${x.id}','${id}')">🗑</button></div></div></div>`).join('')||'<small>No episodes yet.</small>'}</div><h3 id=xh>Add episode</h3><div class=fm id=ef></div><div class=bs><button class=bt onclick="se('${id}')">Save episode</button><button class="bt o" onclick="xf({season:1,number:${n},available:true})">Clear</button></div></div></div>`;xf({season:1,number:a.type=='Movie'?1:n,available:true})}
const xf=(v={})=>{xid=v.id||null;$('#xh').textContent=xid?'Edit episode':'Add episode';$('#ef').innerHTML=fld('number','Episode number',v,'number')+fld('title','Title',v)+pick('thumb','Thumbnail (optional)',v,1280)+vpick(v)+`<label>Description<textarea data-f=description rows=3>${esc(v.description)}</textarea></label>`+tgl('available','Visible to everyone',v)+`<details><summary>More options</summary><div class=fm>${fld('season','Season number',v,'number')}${spick(v)}${fld('air_date','Air date',v,'date')}${fld('duration','Duration (e.g. 11:34)',v)}</div></details>`};
const xe=id=>{xf(XC[id]);$('#ef').scrollIntoView({behavior:'smooth'})};
async function se(aid){const o=col($('#ef'));o.anime_id=aid;o.season=o.season||1;if(!o.number||!o.title)return toast('Episode number and title are required');const r=xid?await sb.from('episodes').update(o).eq('id',xid):await sb.from('episodes').insert(o);if(r.error)return toast(r.error.message);toast('Episode saved');ax(aid)}
async function xd(id,aid){if(confirm('Delete this episode?')){await sb.from('episodes').delete().eq('id',id);ax(aid)}}

/* ---------- video & subtitle upload (from gallery) ---------- */
const vpick=(v={})=>`<div class=pk><small>Episode video (from your gallery)</small><label class="pkb vid"><input type=file accept="video/*" hidden onchange=vk(this)><input type=hidden data-f=video_url value="${esc(v.video_url)}"><span>${v.video_url?'✓ Video uploaded. Tap to replace':'＋ Tap to choose video'}</span></label><div class=bar><i></i></div><small>Max ${C.MAXMB} MB per video. Thumbnail and duration are filled automatically.</small></div>`;
const spick=(v={})=>`<div class=pk><small>Subtitles file (.srt or .vtt, optional)</small><label class="pkb vid"><input type=file accept=".srt,.vtt" hidden onchange=sk(this)><input type=hidden data-f=subtitle_url value="${esc(v.subtitle_url)}"><span>${v.subtitle_url?'✓ Subtitles added. Tap to replace':'＋ Tap to choose subtitle file'}</span></label></div>`;
async function upv(file,folder,cb){const{data:{session}}=await sb.auth.getSession();const ext=(file.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,''),path=`${folder}/${Date.now()}.${ext}`;
return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('POST',`${C.URL}/storage/v1/object/media/${path}`);x.setRequestHeader('Authorization','Bearer '+session.access_token);x.setRequestHeader('apikey',C.KEY);x.setRequestHeader('x-upsert','true');x.setRequestHeader('Content-Type',file.type||'application/octet-stream');x.upload.onprogress=e=>e.lengthComputable&&cb(e.loaded/e.total);
x.onload=()=>{if(x.status<300)return res(sb.storage.from('media').getPublicUrl(path).data.publicUrl);let m='Upload failed ('+x.status+')';try{m=JSON.parse(x.responseText).message||m}catch(_){}rej(new Error(m))};x.onerror=()=>rej(new Error('Network error. Check your internet.'));x.send(file)})}
async function vk(i){const f=i.files[0];if(!f)return;if(f.size>C.MAXMB*1048576)return toast('This video is '+Math.round(f.size/1048576)+' MB. The limit is '+C.MAXMB+' MB. Compress it and try again.');
const l=i.closest('.pk'),s=l.querySelector('span'),b=l.querySelector('.bar i'),ef=$('#ef');s.textContent='Reading video…';
try{const u=URL.createObjectURL(f),v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=u;await new Promise((r,j)=>{v.onloadedmetadata=r;v.onerror=()=>j(new Error('This video format cannot be read. Use an MP4 file.'))});
const d=v.duration||0;if(d)ef.querySelector('[data-f=duration]').value=Math.floor(d/60)+':'+String(Math.floor(d%60)).padStart(2,'0');
const th=ef.querySelector('[data-f=thumb]');
if(!th.value)try{v.currentTime=Math.min(2,d/3);await new Promise(r=>v.onseeked=r);const c=document.createElement('canvas'),k=Math.min(1,1280/v.videoWidth);c.width=v.videoWidth*k;c.height=v.videoHeight*k;c.getContext('2d').drawImage(v,0,0,c.width,c.height);const bl=await new Promise(r=>c.toBlob(r,'image/webp',.85)),tp=`art/${Date.now()}.webp`,{error}=await sb.storage.from('media').upload(tp,bl,{contentType:'image/webp'});if(!error){th.value=sb.storage.from('media').getPublicUrl(tp).data.publicUrl;let g=th.parentNode.querySelector('img');if(!g){g=document.createElement('img');th.parentNode.prepend(g)}g.src=th.value}}catch(_){}
URL.revokeObjectURL(u);
const url=await upv(f,'videos',p=>{b.style.width=(p*100)+'%';s.textContent='Uploading '+Math.round(p*100)+'%'});l.querySelector('[data-f=video_url]').value=url;s.textContent='✓ Video uploaded. Tap to replace'}
catch(e){s.textContent='＋ Tap to choose video';b.style.width=0;toast('Upload failed: '+e.message)}}
async function sk(i){const f=i.files[0];if(!f)return;const l=i.closest('.pk'),s=l.querySelector('span');try{let t=await f.text();if(!/^\s*WEBVTT/.test(t))t='WEBVTT\n\n'+t.replace(/(\d+:\d+:\d+),(\d+)/g,'$1.$2');const p=`subs/${Date.now()}.vtt`,r=await sb.storage.from('media').upload(p,new Blob([t],{type:'text/vtt'}),{contentType:'text/vtt'});if(r.error)throw r.error;l.querySelector('[data-f=subtitle_url]').value=sb.storage.from('media').getPublicUrl(p).data.publicUrl;s.textContent='✓ Subtitles added. Tap to replace'}catch(e){toast('Subtitle upload failed: '+e.message)}}
/* ---------- boot ---------- */
(async()=>{await loadA();const{data:{session}}=await sb.auth.getSession();await setU(session);sb.auth.onAuthStateChange((ev,s)=>{if(ev=='PASSWORD_RECOVERY'){location.hash='#/me';toast('Set your new password below')}if((s?.user?.id||0)!=(me?.id||0))setU(s).then(R)});setTimeout(()=>$('#sp')?.remove(),2500);R()})();
</script></body></html>
